# Company registry — only include boards we can poll publicly.
# board_token defaults to the YAML key (slug) unless overridden.
#
# Official-site adapters: google, amazon, apple, uber, amd, meta.
# Meta uses metacareers.com GraphQL (jobsearch); some networks get HTTP 400
# bot blocks — the adapter still polls and surfaces the error when blocked.

companies:
  # --- FAANG-adjacent / AI labs ---
  google:
    name: Google
    provider: google
    priority: 10
    career_url: https://www.google.com/about/careers/applications/jobs/results
    metadata:
      search_queries:
        - Software Engineering Intern
        - Software Engineer Intern
        - SWE Intern
      search_locations:
        - United States
        - Canada

  amazon:
    name: Amazon
    provider: amazon
    priority: 10
    career_url: https://www.amazon.jobs
    metadata:
      search_queries:
        - Software Development Engineer Internship
        - Software Development Engineer Intern
        - SDE Intern
      search_locations:
        - United States
        - Canada

  apple:
    name: Apple
    provider: apple
    priority: 10
    career_url: https://jobs.apple.com
    metadata:
      search_queries:
        - software engineer intern
        - software engineering intern
        - intern
      search_locations:
        - united-states-USA
        - canada-CAN

  meta:
    name: Meta
    provider: meta
    priority: 10
    career_url: https://www.metacareers.com/jobsearch/
    metadata:
      search_queries:
        - null
        - Software Engineer Intern
        - Software Engineering Intern
      teams:
        - Internship - Engineering, Tech & Design
      include_university_grad: false

  uber:
    name: Uber
    provider: uber
    priority: 8
    career_url: https://www.uber.com/careers
    metadata:
      search_queries:
        - Software Engineer Intern
        - Intern
      countries:
        - USA
        - CAN

  amd:
    name: AMD
    provider: amd
    priority: 8
    career_url: https://careers.amd.com
    metadata:
